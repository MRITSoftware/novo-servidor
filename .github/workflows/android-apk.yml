name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Gradle 8.2.2
        run: |
          curl -sSL -o gradle-8.2.2-bin.zip https://services.gradle.org/distributions/gradle-8.2.2-bin.zip
          unzip -q gradle-8.2.2-bin.zip

      - name: Build debug APK
        run: ./gradle-8.2.2/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
